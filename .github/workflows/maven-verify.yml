name: Maven verify

# Reusable: builds and tests a Maven Wrapper project with ./mvnw verify.
# The caller grants contents: read.

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version (Eclipse Temurin).
        type: string
        default: '25'

jobs:
  maven:
    name: maven
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
      - run: ./mvnw -B --no-transfer-progress verify
